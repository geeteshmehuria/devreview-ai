# Local development stack. Ports are bound to 127.0.0.1 so the database and
# Redis (with their default dev passwords) are never reachable from the network.
services:
  db:
    # Postgres 16 with the pgvector extension (RAG chat embeddings). Debian-based, so an old
    # postgres:16-alpine volume should be recreated (`make clean`) — collations differ.
    image: pgvector/pgvector:pg16
    container_name: devreview_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devreview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devreview_secret}
      POSTGRES_DB: ${POSTGRES_DB:-devreview_ai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devreview}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: devreview_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-redis_secret}  # lets the healthcheck auth without a CLI arg
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devreview_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-devreview}:${POSTGRES_PASSWORD:-devreview_secret}@db:5432/${POSTGRES_DB:-devreview_ai}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: devreview_frontend
    restart: unless-stopped
    env_file:
      - path: ./frontend/.env.local
        required: false
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
