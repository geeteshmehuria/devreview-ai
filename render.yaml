# Render Blueprint for DevReview AI — backend API (with the ARQ job worker embedded).
# Postgres is hosted externally on Neon (free tier, no expiry) — set DATABASE_URL manually.
# Redis is hosted externally on Upstash (free tier, saved to disk) — set REDIS_URL manually.
# Render's free Key Value is in-memory only, so a restart there would lose queued jobs.
#
# Deploy: Render Dashboard → New → Blueprint → connect this repo → Apply.
# After the first deploy, set the values marked `sync: false` in the Render
# dashboard (Environment tab). See DEPLOYMENT.md for the full walkthrough.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend API (FastAPI) + embedded ARQ worker ─────────────────────────────
  # To move the worker to its own service later ($7/mo Starter — no free plan for workers):
  # add a `type: worker` service with startCommand `arq app.jobs.worker.WorkerSettings`,
  # the same env vars, and set WORKER_MODE=external on both.
  - type: web
    name: devreview-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Free tier does not support preDeployCommand, so migrations run at startup.
    # `alembic upgrade head` is idempotent — a no-op when already up to date.
    # --proxy-headers: trust Render's proxy so rate limiting sees the real client IP
    # (safe here because the service is only reachable through Render's load balancer).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      # Secret auto-generated by Render (never in source control)
      - key: JWT_SECRET_KEY
        generateValue: true
      # ── Background jobs (see backend/app/jobs) ─────────────────────────────────
      - key: WORKER_MODE
        value: embedded
      # One Redis command per check: 15s keeps an always-awake worker near 170K commands/month,
      # inside Upstash's free 500K. A new job may wait up to 15s to start.
      - key: WORKER_POLL_DELAY_SECONDS
        value: "15"
      - key: WORKER_MAX_JOBS
        value: "1" # 512 MB free instance: run one clone/embedding job at a time
      - key: AI_PRIMARY_PROVIDER
        value: gemini
      # ── Set these manually in the dashboard after deploy (sync: false) ─────────
      # DATABASE_URL → Neon connection string (postgresql://...?sslmode=require)
      - key: DATABASE_URL
        sync: false
      # REDIS_URL → Upstash "TCP" connection string (rediss://default:<password>@<host>.upstash.io:6379)
      - key: REDIS_URL
        sync: false
      # ALLOWED_ORIGINS  → your Vercel frontend URL, e.g. https://devreview-ai.vercel.app
      - key: ALLOWED_ORIGINS
        sync: false
      # GITHUB_CALLBACK_URL → https://<your-frontend>.vercel.app/callback
      - key: GITHUB_CALLBACK_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
